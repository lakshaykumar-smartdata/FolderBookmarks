<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Folder Bookmarks</title>
<style>
  :root {
    --bg: #f5f5f3; --surface: #ffffff; --border: #e6e6e2; --border-strong: #d4d4cf;
    --ink: #1b1b19; --muted: #74746e; --faint: #a3a39d;
    --accent: #1b1b19; --accent-ink: #ffffff; --danger: #b42318;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.18);
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: var(--ink); background: var(--bg);
    -webkit-user-select: none; user-select: none; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  input { font: inherit; color: inherit; }
  svg { display: block; }
  ::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: #d6d6d1; border-radius: 10px; border: 3px solid var(--bg); }

  /* Top bar */
  .topbar {
    position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px; padding: 0 32px; height: 60px;
  }
  .brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
  .brand .mark { width: 26px; height: 26px; border-radius: 7px; background: var(--ink); color: #fff; display: grid; place-items: center; }
  .search { margin-left: auto; position: relative; width: 300px; }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--faint); }
  .search input {
    width: 100%; height: 36px; padding: 0 12px 0 34px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); outline: 0;
  }
  .search input:focus { border-color: var(--border-strong); background: #fff; }
  .btn { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; height: 36px; padding: 0 14px; border-radius: 8px; font-weight: 500; transition: background .12s, transform .08s; }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { background: #333331; }
  .btn-ghost { border: 1px solid var(--border); background: #fff; }
  .btn-ghost:hover { background: var(--bg); }

  /* Content */
  .page { max-width: 1240px; margin: 0 auto; padding: 32px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
  .section-head h1 { font-size: 22px; font-weight: 600; letter-spacing: -.02em; margin: 0; }
  .section-head span { color: var(--muted); font-size: 13px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); min-height: 60px; }
  .group { margin-bottom: 36px; border-radius: var(--radius); }
  .group h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .group h2 .n { font-weight: 500; color: var(--faint); letter-spacing: 0; text-transform: none; }
  .group h2::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .group h2 .rename { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: var(--faint); opacity: 0; }
  .group h2:hover .rename { opacity: 1; }
  .group h2 .rename:hover { background: #fff; color: var(--ink); }
  .group h2 input { font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--ink); border: 0; border-bottom: 1.5px solid var(--ink); background: none; outline: 0; padding: 0; width: 220px; }
  .group.over { outline: 2px dashed var(--border-strong); outline-offset: 10px; }
  .card.dragging { opacity: .35; }
  .card.over { box-shadow: -3px 0 0 0 var(--ink); }
  .grip { color: var(--faint); cursor: grab; margin-left: auto; }

  /* Card */
  .card {
    position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 18px 14px; cursor: pointer; transition: border-color .12s, box-shadow .15s, transform .15s;
    display: flex; flex-direction: column; gap: 14px;
  }
  .card:hover { border-color: var(--border-strong); box-shadow: var(--shadow); transform: translateY(-2px); }
  .card-top { display: flex; gap: 14px; align-items: flex-start; }
  .mono {
    width: 44px; height: 44px; border-radius: 10px; flex: none; display: grid; place-items: center;
    font-weight: 600; font-size: 18px; letter-spacing: -.02em;
  }
  .card h3 { margin: 0 0 3px; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .path {
    margin: 0; color: var(--muted); font: 12px/1.4 Consolas, "Cascadia Mono", monospace; direction: rtl; text-align: left;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card .path span { direction: ltr; unicode-bidi: bidi-override; }
  .card-info { min-width: 0; flex: 1; }
  .card-foot { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 12px; }
  .open-hint { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
  .card:hover .open-hint { color: var(--ink); }
  .actions { display: flex; gap: 4px; opacity: 0; transition: opacity .12s; }
  .card:hover .actions { opacity: 1; }
  .icon-btn { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; color: var(--muted); }
  .icon-btn:hover { background: var(--bg); color: var(--ink); }
  .icon-btn.danger:hover { color: var(--danger); background: #fdf2f1; }

  /* Palette for monograms: soft tint bg + deep ink */
  .t0 { background: #e8f0fe; color: #1a4fb0; } .t1 { background: #e6f4ea; color: #1e6b37; }
  .t2 { background: #fef3e2; color: #9a5a05; } .t3 { background: #fce8e6; color: #b3261e; }
  .t4 { background: #f1e8fd; color: #6a3fb5; } .t5 { background: #e0f4f5; color: #0b6a72; }

  /* Empty */
  .empty { display: none; border: 1.5px dashed var(--border-strong); border-radius: var(--radius); padding: 64px 24px; text-align: center; color: var(--muted); }
  .empty.show { display: block; }
  .empty strong { display: block; color: var(--ink); font-size: 15px; margin: 12px 0 4px; }

  /* Modal */
  .overlay { position: fixed; inset: 0; background: rgba(20,20,18,.45); display: none; place-items: center; z-index: 50; }
  .overlay.show { display: grid; }
  .modal { width: 480px; background: var(--surface); border-radius: 14px; padding: 24px; box-shadow: 0 24px 60px -20px rgba(0,0,0,.4); }
  .modal h2 { margin: 0 0 20px; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
  .field input { width: 100%; height: 38px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: #fff; outline: 0; }
  .field input:focus { border-color: var(--ink); }
  .field input[readonly] { background: var(--bg); color: var(--muted); font: 12.5px Consolas, "Cascadia Mono", monospace; text-overflow: ellipsis; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; min-width: 0; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
  .err { color: var(--danger); font-size: 12.5px; min-height: 18px; margin-top: -8px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="mark"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div>
    Folder Bookmarks
  </div>
  <div class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5" stroke-linecap="round"/></svg>
    <input id="search" placeholder="Search" oninput="render()">
  </div>
  <button class="btn btn-primary" onclick="openModal()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    New bookmark
  </button>
</div>

<div class="page">
  <div class="section-head"><h1>Projects</h1><span id="count"></span></div>
  <div id="groups"></div>
  <div id="empty" class="empty">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" style="margin:auto"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    <strong>No bookmarks yet</strong>
    Add a project folder and it will show up here as a card.
  </div>
</div>

<div id="overlay" class="overlay">
  <div class="modal">
    <h2 id="modalTitle">New bookmark</h2>
    <div class="field">
      <label>Title</label>
      <input id="fTitle" placeholder="Project name" maxlength="80">
    </div>
    <div class="field">
      <label>Group</label>
      <input id="fGroup" list="groupList" placeholder="e.g. Healthcare — type a new name to create one" maxlength="40">
      <datalist id="groupList"></datalist>
    </div>
    <div class="field">
      <label>Folder</label>
      <div class="row">
        <input id="fPath" readonly placeholder="No folder selected">
        <button class="btn btn-ghost" onclick="post({type:'pick'})">Browse…</button>
      </div>
    </div>
    <div id="err" class="err"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveCard()">Save</button>
    </div>
  </div>
</div>

<script>
const bridge = window.chrome?.webview;
const post = m => bridge?.postMessage(m);
const $ = id => document.getElementById(id);
let bookmarks = [], editIndex = -1;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tint = s => 't' + ([...s].reduce((a, c) => a + c.charCodeAt(0), 0) % 6);
const initials = s => s.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();

bridge?.addEventListener('message', e => {
  const m = e.data;
  if (m.type === 'bookmarks') { bookmarks = m.bookmarks ?? []; render(); }
  else if (m.type === 'picked') {
    $('fPath').value = m.path;
    if (!$('fTitle').value.trim()) $('fTitle').value = m.path.split(/[\\/]/).filter(Boolean).pop();
  }
  else if (m.type === 'error') alert(m.message);
});

function render() {
  const q = $('search').value.trim().toLowerCase();
  const list = bookmarks.map((b, i) => ({ ...b, i })).filter(b => (b.title + ' ' + b.path + ' ' + (b.group ?? '')).toLowerCase().includes(q));
  const groups = new Map();                       // insertion order = first appearance
  for (const b of list) { const g = b.group ?? ''; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(b); }
  if (groups.has('')) { const u = groups.get(''); groups.delete(''); groups.set('', u); }   // ungrouped last
  $('groups').innerHTML = [...groups].map(([g, items]) => `
    <section class="group" data-group="${esc(g)}">
      <h2><span class="name">${esc(g || 'Ungrouped')}</span> <span class="n">${items.length}</span>${g ? `<button class="rename" data-act="rename" title="Rename group"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>` : ''}</h2>
      <div class="grid">${items.map(card).join('')}</div>
    </section>`).join('');
  $('groupList').innerHTML = [...new Set(bookmarks.map(b => b.group).filter(Boolean))].map(g => `<option value="${esc(g)}">`).join('');
  $('empty').classList.toggle('show', bookmarks.length === 0);
  $('count').textContent = q ? `${list.length} of ${bookmarks.length}` : `${bookmarks.length} ${bookmarks.length === 1 ? 'folder' : 'folders'}`;
}

const card = b => `
    <div class="card" data-i="${b.i}" draggable="true">
      <div class="card-top">
        <div class="mono ${tint(b.title)}">${esc(initials(b.title))}</div>
        <div class="card-info">
          <h3 title="${esc(b.title)}">${esc(b.title)}</h3>
          <p class="path" title="${esc(b.path)}"><span>${esc(b.path)}</span></p>
        </div>
        <svg class="grip" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>
      </div>
      <div class="card-foot">
        <span class="open-hint">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>
          Open in Explorer
        </span>
        <div class="actions">
          <button class="icon-btn" data-act="edit" title="Edit"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
          <button class="icon-btn danger" data-act="remove" title="Remove"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
        </div>
      </div>
    </div>`;

// --- Drag & drop: drop on a card = insert before it; drop on a group's empty space = append to that group.
let dragFrom = null;
const G = $('groups');
G.addEventListener('dragstart', e => { const c = e.target.closest('.card'); if (!c) return; dragFrom = +c.dataset.i; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
G.addEventListener('dragend', () => { dragFrom = null; G.querySelectorAll('.dragging,.over').forEach(x => x.classList.remove('dragging', 'over')); });
G.addEventListener('dragover', e => {
  const sec = e.target.closest('.group'); if (!sec || dragFrom === null) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  G.querySelectorAll('.over').forEach(x => x.classList.remove('over'));
  const c = e.target.closest('.card');
  (c && +c.dataset.i !== dragFrom ? c : sec).classList.add('over');
});
G.addEventListener('drop', e => {
  const sec = e.target.closest('.group'); if (!sec || dragFrom === null) return;
  e.preventDefault();
  const c = e.target.closest('.card');
  moveCard(dragFrom, c ? +c.dataset.i : null, sec.dataset.group);
});
function moveCard(from, before, group) {
  const [b] = bookmarks.splice(from, 1);
  if (group) b.group = group; else delete b.group;
  let at;
  if (before === null) { let last = -1; bookmarks.forEach((x, i) => { if ((x.group ?? '') === group) last = i; }); at = last < 0 ? bookmarks.length : last + 1; }
  else at = before > from ? before - 1 : before;
  bookmarks.splice(at, 0, b);
  persist();
}

G.addEventListener('click', e => {
  if (e.target.closest('[data-act="rename"]')) return renameGroup(e.target.closest('.group'));
  const card = e.target.closest('.card'); if (!card) return;
  const i = +card.dataset.i, act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'edit') openModal(i);
  else if (act === 'remove') { if (confirm(`Remove "${bookmarks[i].title}"?`)) { bookmarks.splice(i, 1); persist(); } }
  else post({ type: 'open', path: bookmarks[i].path });
});

function renameGroup(sec) {
  const old = sec.dataset.group, name = sec.querySelector('.name');
  const input = Object.assign(document.createElement('input'), { value: old, maxLength: 40 });
  name.replaceWith(input); input.focus(); input.select();
  let done = false;
  const commit = () => {
    if (done) return; done = true;
    const next = input.value.trim();
    if (next && next !== old) bookmarks.forEach(b => { if (b.group === old) b.group = next; });
    persist();                                   // re-render restores the header either way
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') { done = true; render(); } });
}

function openModal(i = -1) {
  editIndex = i;
  $('modalTitle').textContent = i < 0 ? 'New bookmark' : 'Edit bookmark';
  $('fTitle').value = i < 0 ? '' : bookmarks[i].title;
  $('fPath').value  = i < 0 ? '' : bookmarks[i].path;
  $('fGroup').value = i < 0 ? '' : (bookmarks[i].group ?? '');
  $('err').textContent = '';
  $('overlay').classList.add('show');
  $('fTitle').focus();
}
function closeModal() { $('overlay').classList.remove('show'); }
function saveCard() {
  const title = $('fTitle').value.trim(), path = $('fPath').value.trim();
  if (!title || !path) { $('err').textContent = 'Both a title and a folder are required.'; return; }
  const group = $('fGroup').value.trim();
  const b = group ? { title, path, group } : { title, path };
  if (editIndex < 0) bookmarks.push(b); else bookmarks[editIndex] = b;
  persist(); closeModal();
}
function persist() { post({ type: 'save', bookmarks }); render(); }

document.addEventListener('keydown', e => {
  if (!$('overlay').classList.contains('show')) return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') saveCard();
});
post({ type: 'load' });
</script>
</body>
</html>
